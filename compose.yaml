services:
  fardin_portfolio_server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
    volumes:
      - fardin_portfolio_uploads:/app/uploads
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  fardin_portfolio_uploads:
